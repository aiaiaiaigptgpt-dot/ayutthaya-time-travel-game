name: Optimize game image assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optimize-game-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Optimize all PNG game assets and update references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          
          root = Path(".")
          pngs = sorted(root.glob("*.png"))
          before = sum(p.stat().st_size for p in pngs)
          for src in pngs:
              target = src.with_suffix(".webp")
              with Image.open(src) as opened:
                  im = opened.copy()
              if im.mode not in ("RGB", "RGBA"):
                  im = im.convert("RGBA" if "A" in im.getbands() else "RGB")
              is_walk = "-walk" in src.name
              if not is_walk:
                  limit = (1600, 900) if im.width / im.height > 1.35 else (1000, 1000)
                  im.thumbnail(limit, Image.Resampling.LANCZOS)
              # Alpha transparency is supported by WebP, including on character portraits.
              im.save(target, "WEBP", quality=86 if im.mode == "RGBA" else 82, method=6)
              if target.stat().st_size >= src.stat().st_size:
                  # Retain original dimensions and visually lossless output but skip larger variants.
                  target.unlink()
                  print("SKIP", src.name, "WebP not smaller")
              else:
                  print("OPT", src.name, src.stat().st_size, "->", target.stat().st_size)
          
          # Rewrite only references whose optimized image exists, keeping originals as backup.
          for name in ("js/game.js", "index.html"):
              p = root / name
              content = p.read_text(encoding="utf-8")
              for png in pngs:
                  if png.with_suffix(".webp").exists():
                      content = content.replace(png.name, png.with_suffix(".webp").name)
              # Also catch dynamic filenames assembled from JS pieces e.g. student-boy-walk.png.
              dynamic_groups = ("student-", "farmer-", "boatman-", "merchant-", "port-officer-")
              if name.endswith(".js"):
                  content = re.sub(r"(\\+\\.png)", r"\\.webp", content) if False else content
                  # For dynamic filenames ensure all needed source images have WebP versions.
                  if all((root / x).with_suffix(".webp").exists() for x in [
                      "student-boy-normal.png", "student-girl-normal.png",
                      "student-boy-walk.png", "student-girl-walk.png",
                      "farmer-normal.png", "boatman-normal.png",
                      "merchant-smile.png", "port-officer-normal.png"
                  ]):
                      content = content.replace("+'.png'", "+'.webp'").replace("+'.png`", "+'.webp`")
                      content = content.replace("}.png`", "}.webp`").replace("-.png", "-.webp")
                      content = content.replace(".png`", ".webp`")
              else:
                  content = content.replace("load-on-demand-20261105", "webp-optimized-20261105")
              p.write_text(content, encoding="utf-8")
          after = sum(p.stat().st_size for p in root.glob("*.webp"))
          print("TOTAL_PNG_MB", round(before/1048576,2))
          print("TOTAL_WEBP_MB", round(after/1048576,2))
          PY
      - name: Validate JavaScript
        run: node --check js/game.js
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.webp' js/game.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Optimize all game images to WebP while preserving PNG backups"
            git push
          fi
