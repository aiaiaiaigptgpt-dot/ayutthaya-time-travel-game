<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayutthaya Time Travel Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section id="start-screen" class="panel">
      <h1>ย้อนเวลาสู่กรุงศรีอยุธยา</h1>
      <p>เกมผจญภัยสำรวจประวัติศาสตร์</p>
      <button id="start-btn">เริ่มเรื่อง</button>
    </section>

    <section id="game-screen" class="hidden">
      <div class="story-stage">
        <canvas id="game" width="1280" height="720"></canvas>

        <div id="objective" class="objective">เดินไปทางขวาเพื่อกลับบ้าน</div>
        <div id="interaction-prompt" class="interaction-prompt hidden">กด E เพื่อโต้ตอบ</div>

        <div id="dialogue-box" class="dialogue-box hidden">
          <div id="speaker" class="speaker">นักเรียน</div>
          <div id="dialogue-text" class="dialogue-text"></div>
          <button id="dialogue-next-btn">ถัดไป ▶</button>
        </div>
      </div>

      <div class="control-help">
        <span>เดิน: ← → หรือ A / D</span>
        <span>โต้ตอบ: E</span>
      </div>

      <div class="touch-controls">
        <button id="left-btn" aria-label="เดินซ้าย">◀</button>
        <button id="interact-btn">คุย / ตรวจดู</button>
        <button id="right-btn" aria-label="เดินขวา">▶</button>
      </div>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
