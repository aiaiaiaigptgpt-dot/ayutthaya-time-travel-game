<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayutthaya Time Travel Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section id="start-screen" class="panel">
      <h1>ย้อนเวลาสู่กรุงศรีอยุธยา</h1>
      <p>เกมผจญภัยเรียนรู้ประวัติศาสตร์อยุธยา</p>
      <button id="start-btn">เริ่มเกม</button>
    </section>

    <section id="intro-screen" class="hidden">
      <div class="intro-frame">
        <img id="intro-image" src="intro-school.png" alt="ฉากเปิดเรื่อง" />
        <div class="dialogue-box">
          <div id="speaker" class="speaker">ผู้บรรยาย</div>
          <div id="dialogue-text" class="dialogue-text"></div>
          <button id="next-dialogue-btn">ถัดไป ▶</button>
        </div>
      </div>
    </section>

    <section id="game-screen" class="hidden">
      <div class="story-stage">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="stage-dialogue" class="dialogue-box hidden">
          <div id="stage-speaker" class="speaker">นักเรียน</div>
          <div id="stage-dialogue-text" class="dialogue-text"></div>
          <button id="stage-next-btn">ถัดไป ▶</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
