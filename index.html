<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayutthaya Time Travel Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section id="start-screen" class="panel">
      <h1>ย้อนเวลาสู่กรุงศรีอยุธยา</h1>
      <p>เกมต้นแบบ 2D Side-scrolling Auto-runner</p>
      <button id="start-btn">เริ่มเกม</button>
    </section>

    <section id="game-screen" class="hidden">
      <div class="hud">
        <span>ด่าน 1: ชนบทอยุธยา</span>
        <span>คะแนน: <b id="score">0</b></span>
      </div>
      <canvas id="game" width="1280" height="720"></canvas>
      <div class="controls">
        <button id="jump-btn">กระโดด</button>
      </div>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
